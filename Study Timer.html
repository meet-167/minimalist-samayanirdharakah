<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #000000;
    --surface: #141412;
    --track: #1f1e1b;
    --text: #f1efe8;
    --text-dim: #7d7b73;
    --focus: #d9a566;
    --rest: #6fa898;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }
  .app {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .modes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 40px;
  }
  .mode-btn {
    appearance: none;
    border: 1px solid #232320;
    background: var(--surface);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn:focus-visible, .icon-btn:focus-visible, .start-btn:focus-visible {
    outline: 2px solid var(--text); outline-offset: 3px;
  }
  .mode-btn.active { color: #000; border-color: transparent; }
  .mode-btn.active[data-mode="focus"] { background: var(--focus); }
  .mode-btn.active[data-mode="short"] { background: var(--rest); }
  .mode-btn.active[data-mode="long"] { background: var(--rest); }
  .mode-btn.active[data-mode="custom"] { background: var(--focus); }

  .timer-wrap {
    position: relative;
    width: min(280px, 72vw);
    aspect-ratio: 1;
  }
  .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: var(--track); }
  .ring .progress {
    stroke: var(--mode-color, var(--focus));
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke .3s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .ring .progress { transition: stroke .3s ease; }
  }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .time {
    font-family: 'Space Mono', 'SFMono-Regular', Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 13vw, 60px);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .session-label {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .custom-adjust {
    display: flex; align-items: center; gap: 14px;
    margin-top: 18px;
  }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid #232320; background: var(--surface); color: var(--text);
    font-size: 16px; line-height: 1; cursor: pointer;
  }
  .custom-adjust span { font-family: 'Space Mono', monospace; font-size: 14px; min-width: 64px; text-align: center; color: var(--text-dim); }

  .controls {
    display: flex; align-items: center; gap: 20px;
    margin-top: 36px;
  }
  .start-btn {
    appearance: none; border: none; cursor: pointer;
    background: var(--mode-color, var(--focus));
    color: #000;
    font-family: inherit; font-weight: 700; font-size: 15px;
    padding: 14px 44px; border-radius: 999px;
    transition: opacity .2s ease, transform .1s ease;
  }
  .start-btn:active { transform: scale(0.97); }
  .reset-btn {
    appearance: none; border: none; background: none; cursor: pointer;
    color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px;
  }
  .reset-btn:hover { color: var(--text); }

  .dots { display: flex; gap: 8px; margin-top: 30px; margin-bottom: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--track); transition: background .3s ease; }
  .dot.filled { background: var(--focus); }

  .tabs { display: flex; gap: 28px; margin-bottom: 34px; }
  .tab-btn {
    appearance: none; background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-family: inherit; font-size: 14px; font-weight: 700;
    padding-bottom: 8px; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--focus); }
  .tab-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .task-input {
    width: 100%; margin-top: 24px; background: none; border: none;
    border-bottom: 1px solid #232320; color: var(--text); font-family: inherit;
    font-size: 14px; text-align: center; padding: 8px 4px; outline: none;
  }
  .task-input::placeholder { color: var(--text-dim); }
  .task-input:focus { border-bottom-color: var(--focus); }

  .settings-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
  .toggle-chip {
    appearance: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 7px 13px; border-radius: 999px; border: 1px solid #232320;
    background: none; color: var(--text-dim); transition: all .2s ease;
  }
  .toggle-chip.on { color: var(--focus); border-color: var(--focus); }
  .toggle-chip:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  #statsView { width: 100%; }
  .stat-cards { display: flex; gap: 12px; width: 100%; }
  .stat-card { flex: 1; background: var(--surface); border-radius: 16px; padding: 18px 12px; text-align: center; }
  .stat-value { font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700; }
  .stat-label { margin-top: 4px; font-size: 12px; color: var(--text-dim); }

  .goal-row { display: flex; align-items: center; justify-content: space-between; margin-top: 26px; font-size: 13px; color: var(--text-dim); }
  .goal-adjust { display: flex; align-items: center; gap: 12px; }
  .goal-adjust span { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--text); min-width: 78px; text-align: center; }
  .goal-bar { width: 100%; height: 4px; background: var(--track); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .goal-fill { height: 100%; background: var(--focus); width: 0%; transition: width .4s ease; }

  .week-chart { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; height: 84px; margin-top: 32px; }
  .week-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .week-bar { width: 100%; max-width: 20px; min-height: 2px; background: var(--focus); border-radius: 3px 3px 0 0; }
  .week-day { margin-top: 8px; font-size: 10px; color: var(--text-dim); }

  .history { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; }
  .history-item { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .history-task { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-meta { color: var(--text-dim); flex-shrink: 0; font-family: 'Space Mono', monospace; font-size: 12px; }
  .history-empty { color: var(--text-dim); font-size: 13px; text-align: center; }

  .clear-btn { display: block; margin: 22px auto 0; }
</style>
</head>
<body>
  <div class="app">
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="timer">Timer</button>
      <button class="tab-btn" data-tab="stats">Stats</button>
    </div>

    <section id="timerView">
    <div class="modes" id="modes">
      <button class="mode-btn active" data-mode="focus">Focus</button>
      <button class="mode-btn" data-mode="short">Short break</button>
      <button class="mode-btn" data-mode="long">Long break</button>
      <button class="mode-btn" data-mode="custom">Custom</button>
    </div>

    <div class="timer-wrap" id="timerWrap">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="90"></circle>
        <circle class="progress" id="progressCircle" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="center">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="session-label" id="sessionLabel">Focus</div>
      </div>
    </div>

    <div class="custom-adjust" id="customAdjust" hidden>
      <button class="icon-btn" id="customMinus" aria-label="Decrease minutes">–</button>
      <span id="customMinutes">45 min</span>
      <button class="icon-btn" id="customPlus" aria-label="Increase minutes">+</button>
    </div>

    <input class="task-input" id="taskInput" placeholder="What are you working on?" maxlength="60">

    <div class="controls">
      <button class="reset-btn" id="resetBtn">Reset</button>
      <button class="start-btn" id="startBtn">Start</button>
    </div>

    <div class="dots" id="dots"></div>

    <div class="settings-row">
      <button class="toggle-chip" id="autoStartToggle">Auto-start next</button>
      <button class="toggle-chip" id="ambientToggle">Ambient sound</button>
      <button class="toggle-chip" id="notifyToggle">Notify on finish</button>
    </div>
    </section>

    <section id="statsView" hidden>
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-value" id="todayMinutes">0m</div>
          <div class="stat-label">Focused today</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="streakValue">0</div>
          <div class="stat-label">Day streak</div>
        </div>
      </div>

      <div class="goal-row">
        <span>Daily goal</span>
        <div class="goal-adjust">
          <button class="icon-btn" id="goalMinus" aria-label="Decrease goal">–</button>
          <span id="goalValue">8 sessions</span>
          <button class="icon-btn" id="goalPlus" aria-label="Increase goal">+</button>
        </div>
      </div>
      <div class="goal-bar"><div class="goal-fill" id="goalFill"></div></div>

      <div class="week-chart" id="weekChart"></div>

      <div class="history" id="historyList"></div>
      <button class="reset-btn clear-btn" id="clearHistory">Clear history</button>
    </section>
  </div>

<script>
(function () {
  const MODES = {
    focus:  { label: 'Focus',       minutes: 25, color: '--focus' },
    short:  { label: 'Short break', minutes: 5,  color: '--rest'  },
    long:   { label: 'Long break',  minutes: 15, color: '--rest'  },
    custom: { label: 'Custom',      minutes: 45, color: '--focus' }
  };
  const CIRC = 2 * Math.PI * 90;

  const root = document.documentElement;
  const progressCircle = document.getElementById('progressCircle');
  const timerWrap = document.getElementById('timerWrap');
  const timeDisplay = document.getElementById('timeDisplay');
  const sessionLabel = document.getElementById('sessionLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const customAdjust = document.getElementById('customAdjust');
  const customMinutesEl = document.getElementById('customMinutes');
  const dotsEl = document.getElementById('dots');
  const modeButtons = document.querySelectorAll('.mode-btn');
  const taskInput = document.getElementById('taskInput');
  const tabButtons = document.querySelectorAll('.tab-btn');
  const timerView = document.getElementById('timerView');
  const statsView = document.getElementById('statsView');
  const autoStartToggle = document.getElementById('autoStartToggle');
  const ambientToggle = document.getElementById('ambientToggle');
  const notifyToggle = document.getElementById('notifyToggle');
  const goalMinus = document.getElementById('goalMinus');
  const goalPlus = document.getElementById('goalPlus');
  const goalValue = document.getElementById('goalValue');
  const goalFill = document.getElementById('goalFill');
  const todayMinutesEl = document.getElementById('todayMinutes');
  const streakValueEl = document.getElementById('streakValue');
  const weekChart = document.getElementById('weekChart');
  const historyList = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistory');

  progressCircle.style.strokeDasharray = CIRC;

  const STORAGE_KEY = 'studyTimerData_v1';
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return Object.assign({ history: [], dailyGoal: 8, autoStart: false, ambient: false, notify: false }, JSON.parse(raw));
    } catch (e) {}
    return { history: [], dailyGoal: 8, autoStart: false, ambient: false, notify: false };
  }
  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  const data = loadData();

  function toISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  let currentMode = 'focus';
  let customMinutes = 45;
  let totalSeconds = MODES.focus.minutes * 60;
  let remainingSeconds = totalSeconds;
  let endTime = null;
  let intervalId = null;
  let running = false;
  let focusCyclesDone = 0;
  const baseTitle = document.title;

  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, start, dur, peak) {
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(peak, c.currentTime + start + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.05);
  }
  function playClick() { try { tone(360, 0, 0.08, 0.05); } catch (e) {} }
  function playChime() {
    try {
      tone(523.25, 0,   0.9, 0.13);
      tone(659.25, 0.12, 0.9, 0.11);
      tone(783.99, 0.24, 1.1, 0.09);
    } catch (e) {}
  }

  let ambientSource = null;
  function startAmbient() {
    if (!data.ambient || ambientSource) return;
    try {
      const c = ctx();
      const len = 2 * c.sampleRate;
      const buffer = c.createBuffer(1, len, c.sampleRate);
      const out = buffer.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        out[i] = (last + 0.02 * white) / 1.02;
        last = out[i];
        out[i] *= 3.2;
      }
      const src = c.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      const gain = c.createGain();
      gain.gain.value = 0.045;
      src.connect(gain).connect(c.destination);
      src.start();
      ambientSource = src;
    } catch (e) {}
  }
  function stopAmbient() {
    if (ambientSource) { try { ambientSource.stop(); } catch (e) {} ambientSource = null; }
  }
  function notifyComplete(label) {
    if (!data.notify) return;
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Session complete', { body: label });
      }
    } catch (e) {}
  }

  function fmt(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i < focusCyclesDone % 4 ? ' filled' : '');
      dotsEl.appendChild(d);
    }
  }

  function applyModeColor() {
    const cssVar = MODES[currentMode].color;
    timerWrap.style.setProperty('--mode-color', getComputedStyle(root).getPropertyValue(cssVar));
    startBtn.style.setProperty('--mode-color', getComputedStyle(root).getPropertyValue(cssVar));
  }

  function updateRing() {
    const frac = totalSeconds === 0 ? 0 : remainingSeconds / totalSeconds;
    progressCircle.style.strokeDashoffset = CIRC * (1 - frac);
  }

  function updateDisplay() {
    timeDisplay.textContent = fmt(remainingSeconds);
    sessionLabel.textContent = MODES[currentMode].label;
    updateRing();
    if (running) document.title = fmt(remainingSeconds) + ' · ' + MODES[currentMode].label;
    else document.title = baseTitle;
  }

  function setMode(key, opts) {
    opts = opts || {};
    if (running && !opts.silent) pause();
    currentMode = key;
    modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === key));
    customAdjust.hidden = key !== 'custom';
    const minutes = key === 'custom' ? customMinutes : MODES[key].minutes;
    totalSeconds = minutes * 60;
    remainingSeconds = totalSeconds;
    applyModeColor();
    updateDisplay();
  }

  function tick() {
    remainingSeconds = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    updateDisplay();
    if (remainingSeconds <= 0) {
      clearInterval(intervalId);
      running = false;
      startBtn.textContent = 'Start';
      stopAmbient();
      playChime();
      notifyComplete(MODES[currentMode].label + ' just ended');
      if (currentMode === 'focus') {
        data.history.push({
          date: toISO(new Date()),
          task: taskInput.value.trim() || 'Untitled',
          minutes: Math.round(totalSeconds / 60),
          ts: Date.now()
        });
        if (data.history.length > 300) data.history = data.history.slice(-300);
        saveData();
        focusCyclesDone++;
        renderDots();
        if (!statsView.hidden) renderStats();
        setMode(focusCyclesDone % 4 === 0 ? 'long' : 'short', { silent: true });
      } else {
        setMode('focus', { silent: true });
      }
      if (data.autoStart) setTimeout(start, 1200);
    }
  }

  function start() {
    playClick();
    running = true;
    startBtn.textContent = 'Pause';
    endTime = Date.now() + remainingSeconds * 1000;
    intervalId = setInterval(tick, 250);
    startAmbient();
  }

  function pause() {
    playClick();
    running = false;
    startBtn.textContent = 'Start';
    clearInterval(intervalId);
    stopAmbient();
  }

  function reset() {
    playClick();
    if (running) pause();
    const minutes = currentMode === 'custom' ? customMinutes : MODES[currentMode].minutes;
    totalSeconds = minutes * 60;
    remainingSeconds = totalSeconds;
    updateDisplay();
  }

  startBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  document.getElementById('customMinus').addEventListener('click', () => {
    customMinutes = Math.max(5, customMinutes - 5);
    customMinutesEl.textContent = customMinutes + ' min';
    if (!running) { totalSeconds = customMinutes * 60; remainingSeconds = totalSeconds; updateDisplay(); }
  });
  document.getElementById('customPlus').addEventListener('click', () => {
    customMinutes = Math.min(180, customMinutes + 5);
    customMinutesEl.textContent = customMinutes + ' min';
    if (!running) { totalSeconds = customMinutes * 60; remainingSeconds = totalSeconds; updateDisplay(); }
  });

  function renderStats() {
    const todayStr = toISO(new Date());
    const todays = data.history.filter(e => e.date === todayStr);
    const todayMinutes = todays.reduce((s, e) => s + e.minutes, 0);
    todayMinutesEl.textContent = todayMinutes + 'm';

    const dateSet = new Set(data.history.map(e => e.date));
    let streak = 0;
    let cursor = new Date();
    if (!dateSet.has(toISO(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (dateSet.has(toISO(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
    streakValueEl.textContent = streak;

    goalValue.textContent = data.dailyGoal + ' sessions';
    const goalPct = Math.min(100, (todays.length / data.dailyGoal) * 100);
    goalFill.style.width = goalPct + '%';

    weekChart.innerHTML = '';
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d);
    }
    const dayTotals = days.map(d => {
      const iso = toISO(d);
      return data.history.filter(e => e.date === iso).reduce((s, e) => s + e.minutes, 0);
    });
    const max = Math.max(1, ...dayTotals);
    days.forEach((d, i) => {
      const col = document.createElement('div');
      col.className = 'week-col';
      const bar = document.createElement('div');
      bar.className = 'week-bar';
      bar.style.height = (dayTotals[i] / max * 100) + '%';
      const label = document.createElement('div');
      label.className = 'week-day';
      label.textContent = d.toLocaleDateString(undefined, { weekday: 'narrow' });
      col.appendChild(bar);
      col.appendChild(label);
      weekChart.appendChild(col);
    });

    historyList.innerHTML = '';
    const recent = data.history.slice(-8).reverse();
    if (recent.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'No sessions yet — finish a focus session to see it here.';
      historyList.appendChild(empty);
    } else {
      recent.forEach(e => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const time = new Date(e.ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        row.innerHTML = '<span class="history-task"></span><span class="history-meta"></span>';
        row.querySelector('.history-task').textContent = e.task;
        row.querySelector('.history-meta').textContent = e.minutes + 'm · ' + time;
        historyList.appendChild(row);
      });
    }
  }

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.toggle('active', b === btn));
      const isStats = btn.dataset.tab === 'stats';
      timerView.hidden = isStats;
      statsView.hidden = !isStats;
      if (isStats) renderStats();
    });
  });

  autoStartToggle.classList.toggle('on', data.autoStart);
  ambientToggle.classList.toggle('on', data.ambient);
  notifyToggle.classList.toggle('on', data.notify);

  autoStartToggle.addEventListener('click', () => {
    data.autoStart = !data.autoStart;
    autoStartToggle.classList.toggle('on', data.autoStart);
    saveData();
  });
  ambientToggle.addEventListener('click', () => {
    data.ambient = !data.ambient;
    ambientToggle.classList.toggle('on', data.ambient);
    saveData();
    if (data.ambient && running) startAmbient(); else if (!data.ambient) stopAmbient();
  });
  notifyToggle.addEventListener('click', () => {
    data.notify = !data.notify;
    notifyToggle.classList.toggle('on', data.notify);
    saveData();
    try {
      if (data.notify && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    } catch (e) {}
  });

  goalMinus.addEventListener('click', () => {
    data.dailyGoal = Math.max(1, data.dailyGoal - 1);
    saveData();
    renderStats();
  });
  goalPlus.addEventListener('click', () => {
    data.dailyGoal = Math.min(16, data.dailyGoal + 1);
    saveData();
    renderStats();
  });
  clearHistoryBtn.addEventListener('click', () => {
    if (window.confirm('Clear all saved study history? This cannot be undone.')) {
      data.history = [];
      saveData();
      renderStats();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement !== taskInput && !timerView.hidden) {
      e.preventDefault();
      running ? pause() : start();
    }
  });

  applyModeColor();
  renderDots();
  updateDisplay();
})();
</script>
</body>
</html>
